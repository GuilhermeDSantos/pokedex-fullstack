# 8081 and 5434 (docker-compose.yml), so it runs beside the Pokémon project's 8080 and 5433.
server:
  port: 8081

spring:
  application:
    name: task-api
  datasource:
    # Local development defaults (docker-compose.yml); override with DB_URL, DB_USERNAME, DB_PASSWORD.
    url: ${DB_URL:jdbc:postgresql://localhost:5434/tasks}
    username: ${DB_USERNAME:tasks}
    password: ${DB_PASSWORD:tasks}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
  web:
    locale: en
    locale-resolver: fixed
