spring:
  application:
    name: backend
  datasource:
    # Defaults target the local Postgres from docker-compose.yml. The password default is for local
    # development only; Docker overrides all three through environment variables.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pokedex}
    username: ${DB_USERNAME:pokedex}
    password: ${DB_PASSWORD:pokedex}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
    properties:
      hibernate:
        default_batch_fetch_size: 50
  threads:
    virtual:
      enabled: true
  web:
    # The API speaks English, whatever the browser's Accept-Language says.
    locale: en
    locale-resolver: fixed

management:
  endpoints:
    web:
      exposure:
        include: health
