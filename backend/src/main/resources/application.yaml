spring:
  http:
    clients:
      # PokeAPI is the only outbound client; a hung call must become a 503, not a hung request.
      connect-timeout: 2s
      read-timeout: 3s
  application:
    name: backend
  datasource:
    # Defaults target the local Postgres from docker-compose.yml. The password default is for local
    # development only; Docker overrides all three through environment variables.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pokedex}
    username: ${DB_USERNAME:pokedex}
    password: ${DB_PASSWORD:pokedex}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
    properties:
      hibernate:
        default_batch_fetch_size: 50
  threads:
    virtual:
      enabled: true
  web:
    # The API speaks English, whatever the browser's Accept-Language says.
    locale: en
    locale-resolver: fixed

management:
  endpoints:
    web:
      exposure:
        include: health

security:
  jwt:
    # The default is for local development only; Docker sets JWT_SECRET. HS256 needs at least 32 bytes.
    secret: ${JWT_SECRET:local-dev-only-secret-0123456789abcdef}
    ttl: 1h
    issuer: pokemon-catalog

pokeapi:
  base-url: https://pokeapi.co/api/v2
