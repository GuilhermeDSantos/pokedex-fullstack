plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.guilhermeds'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'                    // D-012
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'   // D-008
    implementation 'org.springframework.boot:spring-boot-starter-restclient'              // D-038
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'com.github.ben-manes.caffeine:caffeine'                               // D-012
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'              // D-016
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'     // D-038
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'              // D-015
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'                  // D-015
    testImplementation 'org.testcontainers:testcontainers-postgresql'                     // D-015
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'                       // D-015
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// A fixed name, so the Dockerfile doesn't depend on the project version.
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

// Only the executable jar is needed.
tasks.named('jar') {
    enabled = false
}

// Unit tests (*Test) and integration tests (*IT) run as separate tasks. Gradle's default `test`
// task would otherwise silently skip every *IT (docs/standards/backend.md → Build).
tasks.named('test') {
    useJUnitPlatform()
    filter { excludeTestsMatching '*IT' }
}

def integrationTest = tasks.register('integrationTest', Test) {
    description = 'Runs the integration tests (*IT). Needs Docker for Testcontainers.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching '*IT' }
    shouldRunAfter tasks.named('test')
}

// Controller and repository tests are *IT, so coverage reads both tasks' execution data.
tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test'), integrationTest
    executionData tasks.named('test').get(), integrationTest.get()
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('check') {
    dependsOn integrationTest, tasks.named('jacocoTestReport')
}
